name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build estático
        env:
          GH_PAGES: "1"
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build
      - name: Ubicar salida
        run: |
          DIR=$(dirname "$(find dist .output -name index.html -not -path '*/node_modules/*' 2>/dev/null | head -1)")
          echo "Salida: $DIR"
          cp -r "$DIR" site
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
